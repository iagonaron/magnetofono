<!-- Magnetófono · París, 1951 · VERSIÓN INTERACTIVA EN PRUEBA (Claude para Iago, 18-oct-2026). Página NUEVA: no cambia index.html
     (el portal antiguo del magnetófono) ni nada más del sitio. Todo lo suyo está en cinta/ (LEEME.txt). Quitarla: borrar
     prueba.html y la carpeta cinta/. Motor v3 (18-oct, noche): un vídeo por tramo seguido, con su sonido dentro (cinta/r/, r3/). -->
<script>
/* LAS BOBINAS SE ABREN EN CLASE (como los días de La cabaña y los capítulos de Atonalidad). El portal de gp.lmathome.es (la
   medalla y los avisos «Magnetófono · Bobina N» de la campana) abre esta página con «#cu=<cuenta>&dias=1.2» (y «&dia=2» desde el
   aviso de esa bobina): aquí se quita de la dirección, se guarda en este navegador y la portada solo deja entrar en esas
   bobinas; las demás, con su candado («se abre en clase»). Sin cuenta de alumno guardada (el profe, que entra con su «#c=»; el
   ordenador de clase; quien llega por la dirección sin más): todo abierto. Quitarlo: borrar este bloque. */
(function () {
  var K = 'lm_mag_hitos', st = null, ir = 0;
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  try { st = JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) {}
  try {
    var ps = (location.hash || '').replace(/^#/, '').split('&'), q = {};
    ps.forEach(function (p) { var i = p.indexOf('='); if (i > 0) { try { q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) {} } });
    if (q.c && UUID.test(q.c)) { st = null; try { localStorage.removeItem(K); localStorage.setItem('lm_mag_profe', 'true'); } catch (e) {} }   // el profe: todo abierto
    else if (q.cu && UUID.test(q.cu)) {
      var d = String(q.dias || '').split(/[.,]/).map(Number).filter(function (n) { return n >= 1 && n <= 3; });
      if (d.length) { st = { cuenta: q.cu.toLowerCase(), dias: d, en: new Date().toISOString() }; try { localStorage.setItem(K, JSON.stringify(st)); localStorage.setItem('lm_mag_profe', 'false'); } catch (e) {} }
    }
    if (/^[1-3]$/.test(q.dia || '')) ir = +q.dia;
    if ('cu' in q || 'dias' in q || 'dia' in q) {
      var resto = ps.filter(function (p) { return p && !/^(cu|dias|dia)=/.test(p); }).join('&');
      history.replaceState(history.state, '', location.pathname + location.search + (resto ? '#' + resto : ''));
    }
  } catch (e) {}
  var ab = (st && Array.isArray(st.dias) && st.dias.length) ? st.dias.map(Number) : null;   // null = todo abierto
  window.MagHitos = {
    activo: function () { return !!ab; },
    abierto: function (n) { n = +n; return !ab || ab.indexOf(n) >= 0; },
    ir: function () { var n = ir; ir = 0; return n; }
  };
  if (ab) document.documentElement.classList.add('mag-alumno');
})();
</script>
<!-- LM at home · SELECCIONADOR DE VOLUNTARIOS (como en los otros portales del medallero). Solo con la cuenta Protester: el
     medallero de gp.lmathome.es abre este portal con «#c=<cuenta>»; aquí se quita de la dirección, se guarda en este navegador
     y se carga el seleccionador de https://gp.lmathome.es/voluntarios/ (tema «cinta»; desde la v3, 18-oct, sin botón: en la hora
     de clase, al «Empezar la bobina N», el motor llama a LMVoluntarios.ofrece() y sale «Seleccionar voluntario» en el medio).
     A los alumnos no les hace nada. Quitarlo de este portal: borrar este bloque. -->
<script>
window.LM_VOL_CONFIG = function () {
  return {
    portal: 'magnetofono', tema: 'cinta',
    // (22-oct-2026, v5) una animación por bobina: la 1, la cinta; la 2, el metro de París; la 3, la máquina de escribir
    temaDe: function (op) { var n = op && +op.dia; return n === 2 ? 'caza' : n === 3 ? 'maquina' : 'cinta'; },
    boton: { padre: '#mandos', antes: '#bCalidad', clase: 'mnd', id: 'bVoluntarios' },
    sonidos: { rebobina: 'cinta/a/vol_rebobina.mp3', frena: 'cinta/a/vol_frena.mp3', tecla: 'cinta/a/vol_tecla.mp3' },
    alAbrir: function () { try { if (window.MAG && MAG.pausaHistoria) MAG.pausaHistoria(); } catch (x) {} }
  };
};
(function () {
  try {
    var m = /(?:^#|&)c=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i.exec(location.hash || ''), c = null;
    if (m) {
      c = m[1].toLowerCase(); try { localStorage.setItem('lm_vol_cuenta', c); } catch (e) {}
      try { var h = location.hash.replace(/^#/, '').split('&').filter(function (p) { return p && !/^c=/.test(p); }).join('&');
            history.replaceState(history.state, '', location.pathname + location.search + (h ? '#' + h : '')); } catch (e) {}
    } else { try { c = localStorage.getItem('lm_vol_cuenta'); } catch (e) {} }
    if (!c) return;
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://gp.lmathome.es/voluntarios/lm-voluntarios.js?h=' + Math.floor(Date.now() / 36e5);
    s.onload = function () {
      var ir = function () { try { if (window.LMVoluntarios) window.LMVoluntarios.monta(window.LM_VOL_CONFIG()); } catch (e) {} };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ir); else ir();
    };
    document.head.appendChild(s);
  } catch (e) {}
})();
</script>

.pBob-ic { flex: 0 0 auto; color: var(--lino); display: flex; }
.pBob-tx { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.pBob-t { font: 600 36px/1.05 var(--tit); color: var(--crema); }

#pPanel .pPie { margin-top: 26px; font: 400 16px/1.3 var(--maq); color: rgba(205, 190, 160, .7); letter-spacing: 1px; white-space: nowrap; }
.mag-alumno #pPanel .pPrueba { display: none; }
#portada:not([hidden]) ~ #mandos #bSalir, #mandos:not(.enHistoria) #bSalir { display: none; }
/* los mandos (voluntarios, 60/30, pantalla completa) también encima de la portada */

/* el botón de los voluntarios (lo pone lm-voluntarios.js): cuadrado, solo el icono (el texto va en su title) */

/* ── fin de la bobina ── */
#finBobina { position: absolute; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; }
#finBobina[hidden] { display: none; }
#finBobina .fb-caja { min-width: 760px; box-sizing: border-box; padding: 46px 64px 50px; text-align: center; background: rgba(16, 13, 11, .86);
  border: 2px solid rgba(205, 190, 160, .6); border-radius: 14px; }
#finBobina .fb-t { font: 900 64px/1.05 var(--tit); color: var(--crema); }
